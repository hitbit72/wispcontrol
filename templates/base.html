<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Portal WISP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <span class="navbar-brand">Portal WISP</span>
        {% if user.is_authenticated %}
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white-50 small">{{ user.get_full_name|default:user.username }} · {{ user.get_rol_display }}</span>
            <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Cerrar sesión</a>
        </div>
        {% endif %}
    </nav>
    <main class="container py-4">
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
